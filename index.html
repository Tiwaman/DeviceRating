<!DOCTYPE html>
<html lang="en" style="scroll-behavior:smooth">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DeviceRating — Would you keep it?</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚖️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=DM+Serif+Display&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0A0A0A;--white:#FAFAFA;--grey:#888;--dim:#1A1A1A;--border:#222;--keep:#00E5A0;--return:#FF4D2E;--serif:'DM Serif Display',serif;--sans:'DM Sans',sans-serif}
body{background:var(--bg);color:var(--white);font-family:var(--sans);min-height:100vh;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input{font-family:inherit}

/* NAV */
.nav{display:flex;align-items:center;justify-content:space-between;padding:24px 40px;border-bottom:1px solid var(--border)}
.nav-logo{display:flex;align-items:center;gap:0;font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:700;letter-spacing:-0.5px;user-select:none}
.nav-logo .logo-device{color:var(--white)}
.nav-logo .logo-rating{color:var(--keep)}
.nav-logo .logo-dot{width:8px;height:8px;border-radius:50%;background:var(--keep);display:inline-block;margin-left:4px;margin-bottom:2px;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.nav-tagline{font-size:13px;color:var(--grey);letter-spacing:0.5px}

/* DEVICE TABS */
.tabs-wrap{padding:28px 40px 0;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.tabs-wrap::-webkit-scrollbar{display:none}
.tabs{display:flex;gap:10px;min-width:max-content}
.tab{padding:10px 22px;border-radius:100px;font-size:14px;font-weight:500;background:var(--dim);border:1px solid var(--border);transition:all .15s ease;white-space:nowrap}
.tab:hover{border-color:#444}
.tab.active{background:var(--white);color:var(--bg);border-color:var(--white)}

/* HERO */
.hero{text-align:center;padding:60px 40px 40px;position:relative}
.hero-device{font-family:var(--serif);font-size:clamp(22px,3vw,32px);margin-bottom:8px;opacity:.7}
.ring-wrap{position:relative;width:280px;height:280px;margin:0 auto 24px}
.ring-svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:var(--dim);stroke-width:8}
.ring-fill{fill:none;stroke:var(--keep);stroke-width:8;stroke-linecap:round;transition:stroke-dashoffset 1.2s cubic-bezier(.22,1,.36,1),stroke .3s}
.hero-pct{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-family:var(--serif);font-size:clamp(64px,12vw,120px);line-height:1;letter-spacing:-4px}
.hero-pct .pct-sign{font-size:.45em;opacity:.5;letter-spacing:0}
.hero-label{font-size:15px;color:var(--grey);letter-spacing:1px;text-transform:uppercase}

/* SPLIT BAR */
.split-wrap{max-width:560px;margin:0 auto;padding:0 40px}
.split-bar{display:flex;height:6px;border-radius:3px;overflow:hidden}
.split-keep{background:var(--keep);transition:width 1.2s cubic-bezier(.22,1,.36,1)}
.split-return{background:var(--return);transition:width 1.2s cubic-bezier(.22,1,.36,1)}
.split-labels{display:flex;justify-content:space-between;margin-top:8px;font-size:13px;font-weight:500}
.split-labels .keep-label{color:var(--keep)}
.split-labels .return-label{color:var(--return)}

/* STATS */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;max-width:640px;margin:48px auto 0;padding:0 40px}
.stat-card{background:var(--dim);border:1px solid var(--border);border-radius:14px;padding:22px;text-align:center}
.stat-value{font-family:var(--serif);font-size:28px;margin-bottom:4px}
.stat-label{font-size:12px;color:var(--grey);text-transform:uppercase;letter-spacing:1px}

/* SHARE */
.share-section{text-align:center;margin-top:40px;padding:0 40px}
.share-btn{display:inline-flex;align-items:center;gap:8px;padding:12px 28px;border-radius:100px;background:var(--dim);border:1px solid var(--border);font-size:14px;font-weight:500;transition:all .15s ease}
.share-btn:hover{border-color:#555}
.share-btn svg{width:16px;height:16px}
.share-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.85);z-index:100;align-items:center;justify-content:center;flex-direction:column;gap:20px}
.share-overlay.visible{display:flex}
.share-overlay canvas{border-radius:12px;max-width:90vw}
.share-dl{padding:14px 32px;border-radius:100px;background:var(--keep);color:var(--bg);font-weight:700;font-size:15px;transition:opacity .15s}
.share-dl:hover{opacity:.85}
.share-close{position:absolute;top:24px;right:28px;font-size:28px;color:var(--grey);transition:color .15s}
.share-close:hover{color:var(--white)}

/* HOT TAKES */
.takes-section{max-width:640px;margin:52px auto 0;padding:0 40px}
.takes-header{font-family:var(--serif);font-size:22px;margin-bottom:20px}
.takes-feed{display:flex;flex-direction:column;gap:0}
.take{display:flex;gap:14px;padding:16px 0;border-bottom:1px solid var(--border);animation:slideIn .35s ease}
.take:first-child{border-top:1px solid var(--border)}
@keyframes slideIn{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
.take-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;margin-top:5px}
.take-dot.keep{background:var(--keep)}
.take-dot.return{background:var(--return)}
.take-text{font-size:15px;line-height:1.5;flex:1}
.take-meta{font-size:12px;color:var(--grey);margin-top:4px}
.take-source{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;padding:2px 7px;border-radius:4px;white-space:nowrap;flex-shrink:0}
.take-source.src-user{background:rgba(255,255,255,.06);color:var(--grey)}
.take-source.src-reddit{background:rgba(255,69,0,.12);color:#FF6B3D}
.take-source.src-youtube{background:rgba(255,0,0,.1);color:#FF4444}
.take-source.src-amazon{background:rgba(255,153,0,.1);color:#FFB347}
.take-source.src-bestbuy{background:rgba(0,112,210,.1);color:#4DA3E8}
.take-source.src-gsmarena{background:rgba(154,0,0,.1);color:#D46A6A}
.take-right{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0}
.take-time{font-size:12px;color:var(--grey);white-space:nowrap}

/* VOTE */
.vote-section{max-width:640px;margin:52px auto 0;padding:0 40px}
.vote-card{background:var(--dim);border:1px solid var(--border);border-radius:20px;padding:36px 32px;text-align:center;position:relative;overflow:hidden}
.vote-card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.06),transparent)}
.vote-prompt{font-family:var(--serif);font-size:24px;margin-bottom:6px}
.vote-sub{font-size:14px;color:var(--grey);margin-bottom:28px}
.vote-buttons{display:flex;gap:14px}
.vote-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:10px;padding:24px 18px;border-radius:16px;font-size:15px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;transition:all .2s ease;border:2px solid transparent;position:relative}
.vote-btn .vote-icon{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;transition:transform .2s ease}
.vote-btn.keep-btn{background:rgba(0,229,160,.08);color:var(--keep);border-color:rgba(0,229,160,.15)}
.vote-btn.keep-btn .vote-icon{background:rgba(0,229,160,.15)}
.vote-btn.keep-btn:hover{background:rgba(0,229,160,.18);border-color:rgba(0,229,160,.4);transform:translateY(-2px)}
.vote-btn.keep-btn:hover .vote-icon{transform:scale(1.1)}
.vote-btn.keep-btn:active{transform:translateY(0)}
.vote-btn.return-btn{background:rgba(255,77,46,.08);color:var(--return);border-color:rgba(255,77,46,.15)}
.vote-btn.return-btn .vote-icon{background:rgba(255,77,46,.15)}
.vote-btn.return-btn:hover{background:rgba(255,77,46,.18);border-color:rgba(255,77,46,.4);transform:translateY(-2px)}
.vote-btn.return-btn:hover .vote-icon{transform:scale(1.1)}
.vote-btn.return-btn:active{transform:translateY(0)}
.vote-btn:disabled{opacity:.35;cursor:not-allowed;transform:none!important}
.vote-btn:disabled .vote-icon{transform:none!important}

/* Voted state */
.voted-state{display:none;text-align:center;padding:8px 0 0}
.voted-state.visible{display:block;animation:fadeUp .4s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.voted-check{width:48px;height:48px;border-radius:50%;margin:0 auto 12px;display:flex;align-items:center;justify-content:center;font-size:24px}
.voted-check.keep{background:rgba(0,229,160,.15);color:var(--keep)}
.voted-check.return{background:rgba(255,77,46,.15);color:var(--return)}
.voted-text{font-size:14px;color:var(--grey);margin-bottom:4px}
.voted-verdict{font-family:var(--serif);font-size:18px}

/* Take input - hidden until voted */
.take-phase{max-height:0;overflow:hidden;opacity:0;transition:max-height .4s ease,opacity .3s ease .1s,margin .3s ease}
.take-phase.visible{max-height:200px;opacity:1;margin-top:24px}
.take-phase-label{font-size:13px;color:var(--grey);margin-bottom:10px;text-align:left}
.take-input-wrap{position:relative;display:flex;gap:10px}
.take-input{flex:1;padding:14px 18px;border-radius:12px;background:var(--bg);border:1px solid var(--border);color:var(--white);font-size:14px;outline:none;transition:border-color .15s}
.take-input:focus{border-color:#444}
.take-input::placeholder{color:#444}
.take-submit{padding:14px 20px;border-radius:12px;background:var(--white);color:var(--bg);font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;transition:all .15s ease;white-space:nowrap}
.take-submit:hover{opacity:.85}
.take-submit:disabled{opacity:.3;cursor:not-allowed}
.char-count{font-size:11px;color:var(--grey);text-align:right;margin-top:6px;transition:color .15s}
.char-count.warn{color:var(--return)}

/* FOOTER */
.footer{text-align:center;padding:80px 40px 40px;font-size:13px;color:#444;letter-spacing:.5px}

/* MOBILE */
@media(max-width:768px){
  .nav{padding:14px 16px;gap:8px}
  .nav>div:first-child{gap:14px!important}
  .nav-logo{font-size:16px}
  .nav-logo .logo-dot{width:5px;height:5px;margin-left:3px}
  .nav-tagline{font-size:10px;display:none}
  .tabs-wrap{padding:16px 16px 0}
  .tabs{gap:8px}
  .tab{padding:8px 16px;font-size:13px}
  .hero{padding:32px 16px 28px}
  .hero-device{font-size:20px;margin-bottom:4px}
  .ring-wrap{width:200px;height:200px;margin-bottom:16px}
  .hero-pct{font-size:clamp(52px,15vw,72px);letter-spacing:-3px}
  .hero-label{font-size:12px;letter-spacing:.5px}
  .split-wrap{padding:0 16px}
  .split-labels{font-size:12px}
  .stats{padding:0 16px;gap:8px;margin-top:32px}
  .stat-card{padding:14px 8px;border-radius:12px}
  .stat-value{font-size:20px}
  .stat-label{font-size:9px;letter-spacing:.5px}
  .share-section{padding:0 16px;margin-top:28px}
  .share-btn{padding:10px 22px;font-size:13px}
  .takes-section{padding:0 16px;margin-top:36px}
  .takes-header{font-size:19px;margin-bottom:14px}
  .takes-feed .take:nth-child(n+5){display:none}
  .take{gap:10px;padding:12px 0}
  .take-dot{width:8px;height:8px;margin-top:6px}
  .take-text{font-size:14px;line-height:1.4}
  .take-source{font-size:9px;padding:2px 5px}
  .take-time{font-size:11px}
  .vote-section{padding:0 16px;margin-top:36px}
  .vote-card{padding:24px 16px;border-radius:16px}
  .vote-prompt{font-size:20px}
  .vote-sub{font-size:13px;margin-bottom:20px}
  .vote-buttons{flex-direction:column;gap:10px}
  .vote-btn{flex-direction:row;padding:16px 18px;gap:12px;border-radius:14px;font-size:14px}
  .vote-btn .vote-icon{width:36px;height:36px;font-size:18px}
  .voted-check{width:40px;height:40px;font-size:20px}
  .voted-text{font-size:13px}
  .voted-verdict{font-size:16px}
  .take-phase.visible{margin-top:18px}
  .take-phase-label{font-size:12px}
  .take-input-wrap{flex-direction:column;gap:8px}
  .take-input{font-size:14px;padding:12px 14px}
  .take-submit{padding:12px;text-align:center}
  .share-overlay canvas{max-width:95vw;max-height:60vh}
  .share-dl{padding:12px 28px;font-size:14px}
  .share-close{top:16px;right:16px;font-size:24px}
  .footer{padding:48px 16px 28px;font-size:12px}
}

/* SMALL MOBILE */
@media(max-width:380px){
  .nav{padding:12px 12px}
  .nav-logo{font-size:14px}
  .tabs-wrap{padding:12px 12px 0}
  .tab{padding:7px 12px;font-size:12px}
  .hero{padding:24px 12px 20px}
  .ring-wrap{width:170px;height:170px}
  .hero-pct{font-size:52px;letter-spacing:-2px}
  .stats{padding:0 12px}
  .stat-value{font-size:18px}
  .takes-section{padding:0 12px}
  .vote-section{padding:0 12px}
  .vote-card{padding:20px 14px}
}
</style>
</head>
<body>

<nav class="nav">
  <div style="display:flex;align-items:center;gap:24px">
    <div class="nav-logo"><span class="logo-device">DEVICE</span><span class="logo-rating">RATING</span><span class="logo-dot"></span></div>
    <a href="/blog" style="font-size:14px;color:var(--grey);text-decoration:none;transition:color .15s" onmouseover="this.style.color='var(--white)'" onmouseout="this.style.color='var(--grey)'">Blog</a>
  </div>
  <div class="nav-tagline">the only review that matters</div>
</nav>

<div class="tabs-wrap">
  <div class="tabs" id="tabs"></div>
</div>

<section class="hero">
  <div class="hero-device" id="heroDevice"></div>
  <div class="ring-wrap">
    <svg class="ring-svg" viewBox="0 0 280 280">
      <circle class="ring-bg" cx="140" cy="140" r="124"/>
      <circle class="ring-fill" id="ringFill" cx="140" cy="140" r="124"/>
    </svg>
    <div class="hero-pct"><span id="pctNum">0</span><span class="pct-sign">%</span></div>
  </div>
  <div class="hero-label">would keep it</div>
</section>

<div class="split-wrap">
  <div class="split-bar">
    <div class="split-keep" id="splitKeep"></div>
    <div class="split-return" id="splitReturn"></div>
  </div>
  <div class="split-labels">
    <span class="keep-label" id="keepLabel"></span>
    <span class="return-label" id="returnLabel"></span>
  </div>
</div>

<div class="stats">
  <div class="stat-card"><div class="stat-value" id="statVotes">—</div><div class="stat-label">Total Verdicts</div></div>
  <div class="stat-card"><div class="stat-value" id="statDays">—</div><div class="stat-label">Days Tracked</div></div>
  <div class="stat-card"><div class="stat-value" id="statTrend">—</div><div class="stat-label">Trending</div></div>
</div>

<div class="share-section">
  <button class="share-btn" onclick="openShare()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8a2 2 0 002 2h12a2 2 0 002-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>
    Share Verdict
  </button>
</div>

<div class="share-overlay" id="shareOverlay">
  <button class="share-close" onclick="closeShare()">&times;</button>
  <canvas id="shareCanvas" width="600" height="400"></canvas>
  <button class="share-dl" onclick="downloadShare()">Download PNG</button>
</div>

<section class="takes-section">
  <div class="takes-header">Hot Takes</div>
  <div class="takes-feed" id="takesFeed"></div>
</section>

<section class="vote-section">
  <div class="vote-card">
    <div id="votePhase1">
      <div class="vote-prompt">Would you keep it?</div>
      <div class="vote-sub">Join <span id="voteCountLabel">thousands</span> who already decided</div>
      <div class="vote-buttons">
        <button class="vote-btn keep-btn" id="keepBtn" onclick="vote('keep')">
          <span class="vote-icon">&check;</span>
          Keeping It
        </button>
        <button class="vote-btn return-btn" id="returnBtn" onclick="vote('return')">
          <span class="vote-icon">&times;</span>
          Returning It
        </button>
      </div>
    </div>
    <div class="voted-state" id="votedState">
      <div class="voted-check" id="votedCheck">&check;</div>
      <div class="voted-text">Your verdict is in</div>
      <div class="voted-verdict" id="votedVerdict"></div>
    </div>
    <div class="take-phase" id="takePhase">
      <div class="take-phase-label">Got a hot take? Drop it below.</div>
      <div class="take-input-wrap">
        <input class="take-input" id="takeInput" type="text" maxlength="80" placeholder="80 characters of pure honesty...">
        <button class="take-submit" id="takeSubmitBtn" onclick="submitTake()">Post</button>
      </div>
      <div class="char-count" id="charCount">80 characters left</div>
    </div>
  </div>
</section>

<footer class="footer">built different. no stars. just truth.</footer>

<script>
// Seed data — renders instantly, then API hydrates with live data
const SEED={

    {type:"keep",text:"Action mode video makes everything look cinematic",source:"reddit",time:"1d ago"}
  ]},
  "Samsung S25 Ultra":{slug:"samsung-s25-ultra",keep:68,votes:14310,days:99,trend:"down",takes:[

    {type:"keep",text:"Charges from 0 to 100 while I shower. Insane.",source:"reddit",time:"4h ago"},
    {type:"return",text:"OxygenOS feels unfinished in small but annoying ways",source:"amazon",time:"8h ago"},
    {type:"keep",text:"Flagship specs at \u00a3200 less than the competition",source:"user",time:"12h ago"},
    {type:"return",text:"Resale value is basically zero and I knew it going in",source:"youtube",time:"1d ago"}
  ]}

let devices=JSON.parse(JSON.stringify(SEED));
let deviceNames=Object.keys(devices);
let current=deviceNames[0];
const voted={};
let loading=false;

const CIRC=2*Math.PI*124;
const ring=document.getElementById("ringFill");
ring.style.strokeDasharray=CIRC;
ring.style.strokeDashoffset=CIRC;

// Load voted state from localStorage
try{const s=JSON.parse(localStorage.getItem('kor_voted')||'{}');Object.assign(voted,s)}catch(e){}

function fmt(n){return n.toLocaleString("en-US")}

// Render immediately with seed data, then hydrate from API
buildTabs();
selectDevice(current);

async function loadDevices(){
  try{
    const res=await fetch('/api/devices');
    if(!res.ok)throw new Error('API error');
    const live=await res.json();
    devices=live;
    deviceNames=Object.keys(devices);
    if(!devices[current])current=deviceNames[0];
    selectDevice(current);
  }catch(e){
    console.error('API hydration failed, using seed data:',e);
  }
}

function buildTabs(){
  const c=document.getElementById("tabs");
  c.innerHTML="";
  deviceNames.forEach(name=>{
    const b=document.createElement("button");
    b.className="tab"+(name===current?" active":"");
    b.textContent=name;
    b.onclick=()=>selectDevice(name);
    c.appendChild(b);
  });
}

function animateNumber(el,target,dur){
  const start=performance.now();
  const from=0;
  function tick(now){
    const t=Math.min((now-start)/dur,1);
    const ease=1-Math.pow(1-t,3);
    el.textContent=Math.round(from+(target-from)*ease);
    if(t<1)requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

function selectDevice(name){
  current=name;
  const d=devices[name];
  if(!d)return;
  buildTabs();
  document.getElementById("heroDevice").textContent=name;
  animateNumber(document.getElementById("pctNum"),d.keep,1200);
  const offset=CIRC-(d.keep/100)*CIRC;
  ring.style.strokeDashoffset=CIRC;
  ring.style.stroke=d.keep>=50?"var(--keep)":"var(--return)";
  requestAnimationFrame(()=>{requestAnimationFrame(()=>{ring.style.strokeDashoffset=offset})});
  document.getElementById("splitKeep").style.width=d.keep+"%";
  document.getElementById("splitReturn").style.width=(100-d.keep)+"%";
  document.getElementById("keepLabel").textContent=d.keep+"% keep";
  document.getElementById("returnLabel").textContent=(100-d.keep)+"% return";
  document.getElementById("statVotes").textContent=fmt(d.votes);
  document.getElementById("statDays").textContent=d.days;
  const arrows={up:"\u2191",down:"\u2193",flat:"\u2192"};
  document.getElementById("statTrend").textContent=arrows[d.trend]||"\u2192";
  renderTakes();
  updateVoteUI();
}

const SOURCE_LABELS={user:'User',reddit:'Reddit',youtube:'YouTube',amazon:'Amazon',bestbuy:'Best Buy',gsmarena:'GSMArena'};

function renderTakes(){
  const feed=document.getElementById("takesFeed");
  feed.innerHTML="";
  const d=devices[current];
  if(!d||!d.takes)return;
  d.takes.slice(0,6).forEach(t=>{
    const src=t.source||'user';
    const srcLabel=SOURCE_LABELS[src]||src;
    const div=document.createElement("div");
    div.className="take";
    div.innerHTML=`<div class="take-dot ${t.type}"></div><div style="flex:1"><div class="take-text">${esc(t.text)}</div></div><div class="take-right"><span class="take-source src-${src}">${esc(srcLabel)}</span><span class="take-time">${esc(t.time)}</span></div>`;
    feed.appendChild(div);
  });
}

function esc(s){const d=document.createElement("div");d.textContent=s;return d.innerHTML}

function updateVoteUI(){
  const v=voted[current];
  const phase1=document.getElementById("votePhase1");
  const votedState=document.getElementById("votedState");
  const takePhase=document.getElementById("takePhase");
  const d=devices[current];

  // Update the sub-label with actual count
  if(d){
    const label=document.getElementById("voteCountLabel");
    label.textContent=fmt(d.votes)+" owners";
  }

  if(v){
    phase1.style.display="none";
    votedState.classList.add("visible");
    const check=document.getElementById("votedCheck");
    check.className="voted-check "+v;
    check.innerHTML=v==="keep"?"\u2713":"\u2717";
    document.getElementById("votedVerdict").textContent=
      v==="keep"?"You're keeping it":"You're returning it";
    // Don't show take phase if already voted on revisit
    takePhase.classList.remove("visible");
  }else{
    phase1.style.display="block";
    votedState.classList.remove("visible");
    takePhase.classList.remove("visible");
    document.getElementById("keepBtn").disabled=false;
    document.getElementById("returnBtn").disabled=false;
  }
}

let lastVoteType=null;

async function vote(type){
  if(voted[current]||loading)return;
  const d=devices[current];
  const slug=d.slug||current.toLowerCase().replace(/\s+/g,'-');

  // Disable buttons immediately
  document.getElementById("keepBtn").disabled=true;
  document.getElementById("returnBtn").disabled=true;

  try{
    const res=await fetch('/api/vote',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({device:slug,type})
    });

    if(res.status===409){
      voted[current]=type;
      localStorage.setItem('kor_voted',JSON.stringify(voted));
      updateVoteUI();
      return;
    }

    if(!res.ok)throw new Error('Vote failed');

    const data=await res.json();
    d.keep=data.keep;
    d.votes=data.votes;
    voted[current]=type;
    lastVoteType=type;
    localStorage.setItem('kor_voted',JSON.stringify(voted));

    // Update hero stats
    animateNumber(document.getElementById("pctNum"),d.keep,1200);
    const offset=CIRC-(d.keep/100)*CIRC;
    ring.style.strokeDashoffset=CIRC;
    ring.style.stroke=d.keep>=50?"var(--keep)":"var(--return)";
    requestAnimationFrame(()=>{requestAnimationFrame(()=>{ring.style.strokeDashoffset=offset})});
    document.getElementById("splitKeep").style.width=d.keep+"%";
    document.getElementById("splitReturn").style.width=(100-d.keep)+"%";
    document.getElementById("keepLabel").textContent=d.keep+"% keep";
    document.getElementById("returnLabel").textContent=(100-d.keep)+"% return";
    document.getElementById("statVotes").textContent=fmt(d.votes);

    // Show voted state + take input phase
    document.getElementById("votePhase1").style.display="none";
    const votedState=document.getElementById("votedState");
    votedState.classList.add("visible");
    const check=document.getElementById("votedCheck");
    check.className="voted-check "+type;
    check.innerHTML=type==="keep"?"\u2713":"\u2717";
    document.getElementById("votedVerdict").textContent=
      type==="keep"?"You're keeping it":"You're returning it";

    // Reveal take input after a beat
    setTimeout(()=>{
      document.getElementById("takePhase").classList.add("visible");
      document.getElementById("takeInput").focus();
    },500);

  }catch(e){
    console.error('Vote error:',e);
    document.getElementById("keepBtn").disabled=false;
    document.getElementById("returnBtn").disabled=false;
  }
}

async function submitTake(){
  const inp=document.getElementById("takeInput");
  const text=inp.value.trim();
  if(!text||!lastVoteType||!current)return;

  const d=devices[current];
  const slug=d.slug||current.toLowerCase().replace(/\s+/g,'-');
  const btn=document.getElementById("takeSubmitBtn");
  btn.disabled=true;
  btn.textContent="Posting...";

  try{
    await fetch('/api/vote',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({device:slug,type:lastVoteType,take:text})
    });
    // Even if 409 (already voted), the take might not have been saved
    // Add it locally for instant feedback
    d.takes.unshift({type:lastVoteType,text,source:'user',time:'just now'});
    if(d.takes.length>6)d.takes.pop();
    renderTakes();

    inp.value="";
    document.getElementById("charCount").textContent="80 characters left";
    document.getElementById("charCount").classList.remove("warn");
    btn.textContent="Posted!";
    setTimeout(()=>{
      document.getElementById("takePhase").classList.remove("visible");
    },1500);
  }catch(e){
    btn.textContent="Post";
    btn.disabled=false;
  }
}

document.getElementById("takeInput").addEventListener("input",function(){
  const rem=80-this.value.length;
  const cc=document.getElementById("charCount");
  cc.textContent=rem+" character"+(rem!==1?"s":"")+" left";
  cc.classList.toggle("warn",rem<10);
});

document.getElementById("takeInput").addEventListener("keydown",function(e){
  if(e.key==="Enter"&&this.value.trim())submitTake();
});

function openShare(){
  const d=devices[current];
  if(!d)return;
  const canvas=document.getElementById("shareCanvas");
  const ctx=canvas.getContext("2d");
  canvas.width=600;canvas.height=400;
  ctx.fillStyle="#0A0A0A";
  ctx.fillRect(0,0,600,400);
  ctx.fillStyle="#FAFAFA";
  ctx.font="28px 'DM Serif Display',serif";
  ctx.textAlign="center";
  ctx.fillText(current,300,100);
  ctx.fillStyle="#00E5A0";
  ctx.font="bold 120px 'DM Serif Display',serif";
  ctx.fillText(d.keep+"%",300,240);
  ctx.fillStyle="#888";
  ctx.font="16px 'DM Sans',sans-serif";
  ctx.fillText("would keep it \u00b7 devicerating.com",300,310);
  ctx.fillText(fmt(d.votes)+" verdicts",300,340);
  document.getElementById("shareOverlay").classList.add("visible");
}

function closeShare(){document.getElementById("shareOverlay").classList.remove("visible")}

function downloadShare(){
  const canvas=document.getElementById("shareCanvas");
  const a=document.createElement("a");
  a.download=current.toLowerCase().replace(/\s+/g,"-")+"-verdict.png";
  a.href=canvas.toDataURL("image/png");
  a.click();
}

document.getElementById("shareOverlay").addEventListener("click",function(e){
  if(e.target===this)closeShare();
});

// Auto-refresh takes every 30 seconds
setInterval(async()=>{
  if(!current||!devices[current])return;
  const slug=devices[current].slug||current.toLowerCase().replace(/\s+/g,'-');
  try{
    const res=await fetch(`/api/takes?device=${slug}&limit=6`);
    if(res.ok){
      devices[current].takes=await res.json();
      renderTakes();
    }
  }catch(e){}
},30000);

// Boot
loadDevices();
</script>
</body>
</html>
